{% extends "base.html" %}
{% block content %}
<h2>Dashboard</h2>
<div class="stats-grid" id="statsGrid"></div>
<div class="card mt-4">
    <div class="card-header"><h5 class="mb-0">Recent Payments</h5></div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>Date</th><th>Member</th><th>Amount</th><th>Method</th></tr></thead>
                <tbody id="recentPaymentsBody"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
<script>loadDashboard();</script>
{% endblock %}
