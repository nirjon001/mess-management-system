{% extends "base.html" %}
{% block content %}
<h2>Payments Management</h2>
<div class="card mb-4">
    <div class="card-header"><h5 class="mb-0">Record Payment</h5></div>
    <div class="card-body">
        <form id="paymentForm">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Payment Date</label>
                    <input type="date" class="form-control" id="payDate" name="payment_date" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Amount (BDT)</label>
                    <input type="number" step="0.01" class="form-control" id="payAmount" name="amount" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Payment Method</label>
                    <select class="form-select" id="payMethod" name="payment_method">
                        <option value="Cash">Cash</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        <option value="Mobile Banking">Mobile Banking</option>
                        <option value="Card">Card</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Payment Type</label>
                    <select class="form-select" id="payType" name="payment_type">
                        <option value="rent">Rent</option>
                        <option value="utility">Utility</option>
                        <option value="food">Food</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Assignment</label>
                    <select class="form-select" id="payAssignmentId" name="assignment_id">
                        <option value="">-- None --</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Status</label>
                    <select class="form-select" id="payStatus" name="status">
                        <option value="completed">Completed</option>
                        <option value="pending">Pending</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Record Payment</button>
        </form>
    </div>
</div>
<div class="card">
    <div class="card-header"><h5 class="mb-0">All Payments</h5></div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>ID</th><th>Date</th><th>Member</th><th>Amount</th><th>Method</th><th>Type</th><th>Status</th></tr></thead>
                <tbody id="paymentsTableBody"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
<script>loadPayments();</script>
{% endblock %}
