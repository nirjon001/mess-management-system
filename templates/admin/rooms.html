{% extends "base.html" %}
{% block content %}
<h2>Room Management</h2>
<div class="row">
    <div class="col-md-6 mb-4">
        <div class="card h-100">
            <div class="card-header"><h5 class="mb-0">Add Room Type</h5></div>
            <div class="card-body">
                <form id="roomTypeForm">
                    <div class="mb-3">
                        <label class="form-label">Type Name</label>
                        <input type="text" class="form-control" id="rtName" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Capacity</label>
                        <input type="number" class="form-control" id="rtCapacity" name="capacity" min="1" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Base Rent (BDT)</label>
                        <input type="number" step="0.01" class="form-control" id="rtRent" name="rent" min="0" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Room Type</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-6 mb-4">
        <div class="card h-100">
            <div class="card-header"><h5 class="mb-0">Add Room</h5></div>
            <div class="card-body">
                <form id="roomForm">
                    <div class="mb-3">
                        <label class="form-label">Room Number</label>
                        <input type="number" class="form-control" id="roomNo" name="room_no" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Floor</label>
                        <input type="number" class="form-control" id="roomFloor" name="floor" min="0" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Building</label>
                        <input type="text" class="form-control" id="roomBuilding" name="building" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Room Type</label>
                        <select class="form-select" id="roomTypeId" name="type_id" required>
                            <option value="">-- Select --</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="roomStatus" name="is_available">
                            <option value="1">Available</option>
                            <option value="0">Occupied</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Room</button>
                </form>
            </div>
        </div>
    </div>
</div>
<div class="card">
    <div class="card-header"><h5 class="mb-0">All Rooms</h5></div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>ID</th><th>Room No</th><th>Floor</th><th>Building</th><th>Type</th><th>Rent</th><th>Status</th></tr></thead>
                <tbody id="roomsTableBody"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
<script>loadRooms();</script>
{% endblock %}
