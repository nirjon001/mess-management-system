{% extends "base.html" %}
{% block content %}
<h2>My Expenses</h2>
<div class="card mb-4">
    <div class="card-header"><h5 class="mb-0">My Payments</h5></div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Type</th><th>Status</th></tr></thead>
                <tbody id="expPaymentsBody"></tbody>
            </table>
        </div>
    </div>
</div>
<div class="card">
    <div class="card-header"><h5 class="mb-0">My Meal Orders</h5></div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>Date</th><th>Item</th><th>Qty</th><th>Total</th><th>Status</th></tr></thead>
                <tbody id="expOrdersBody"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/member.js') }}"></script>
<script>loadExpenses();</script>
{% endblock %}
