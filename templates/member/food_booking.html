{% extends "base.html" %}
{% block content %}
<h2>Book Food</h2>
<div class="card mb-4">
    <div class="card-header"><h5 class="mb-0">Filter Menu</h5></div>
    <div class="card-body">
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label">Date</label>
                <input type="date" class="form-control" id="fbDate">
            </div>
            <div class="col-md-4">
                <label class="form-label">Meal Type</label>
                <select class="form-select" id="fbMealType">
                    <option value="">All</option>
                    <option value="breakfast">Breakfast</option>
                    <option value="lunch">Lunch</option>
                    <option value="dinner">Dinner</option>
                </select>
            </div>
            <div class="col-md-4">
                <button class="btn btn-primary" onclick="filterMenu()">Filter</button>
            </div>
        </div>
    </div>
</div>
<div class="card mb-4">
    <div class="card-header"><h5 class="mb-0">Available Menu Items</h5></div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>Item</th><th>Price</th><th>Meal Type</th><th>Action</th></tr></thead>
                <tbody id="fbMenuBody"></tbody>
            </table>
        </div>
    </div>
</div>
<div class="card">
    <div class="card-header"><h5 class="mb-0">My Recent Orders</h5></div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>Date</th><th>Item</th><th>Qty</th><th>Total</th><th>Status</th></tr></thead>
                <tbody id="fbOrdersBody"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/member.js') }}"></script>
<script>loadFoodBooking();</script>
{% endblock %}
