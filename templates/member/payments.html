{% extends "base.html" %}
{% block content %}
<h2>Make Payment</h2>
<div class="card mb-4" id="rentStatusCard">
    <div class="card-body" id="rentStatusBody">
        <div class="text-center text-muted py-3">Loading rent status...</div>
    </div>
</div>
<div class="card mb-4">
    <div class="card-header"><h5 class="mb-0">Submit Payment</h5></div>
    <div class="card-body">
        <form id="memberPaymentForm">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Payment Date</label>
                    <input type="date" class="form-control" id="mpDate" name="payment_date" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Amount (BDT)</label>
                    <input type="number" step="0.01" class="form-control" id="mpAmount" name="amount" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Method</label>
                    <select class="form-select" id="mpMethod" name="payment_method">
                        <option value="Cash">Cash</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        <option value="Mobile Banking">Mobile Banking</option>
                        <option value="Card">Card</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Type</label>
                    <select class="form-select" id="mpType" name="payment_type">
                        <option value="rent">Rent</option>
                        <option value="utility">Utility</option>
                        <option value="food">Food</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Submit Payment</button>
        </form>
    </div>
</div>
<div class="card">
    <div class="card-header"><h5 class="mb-0">My Payment History</h5></div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Type</th><th>Status</th></tr></thead>
                <tbody id="mpHistoryBody"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/member.js') }}"></script>
<script>loadPayments();</script>
{% endblock %}
